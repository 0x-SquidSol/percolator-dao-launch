# Experimental and unaudited. See README.md.
[workspace]
members = ["programs/*", "crates/*"]
exclude = ["programs/README.md", "crates/README.md"]
resolver = "2"
# Builds use Rust 1.78 (see rust-toolchain.toml), but many newer crate
# versions need a newer Rust. Update the lockfile with Rust-version-aware
# resolution, then rebuild on 1.78:
#   CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable update
# Pinned by hand in Cargo.lock: blake3 1.8.2 (newer pulls cpufeatures 0.3,
# which needs a newer Cargo; same version as MetaDAO's lockfile).

# Lints every crate opts into with `[lints] workspace = true`.
[workspace.lints.rust]
# deny, not forbid: an Anchor program entry point may need a narrow, reviewed
# allow. Crates with no such need also forbid it in their own source.
unsafe_code = "deny"

[workspace.lints.clippy]
# Plain + - * / % and friends can overflow, wrap or panic. Math must use
# checked_* (or saturating_* where that is the intended behavior) instead.
arithmetic_side_effects = "deny"
# `as` casts silently truncate, wrap or drop the sign. Use try_from/try_into
# (which fail loudly) instead.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

[profile.release]
# Integer overflow aborts instead of silently wrapping, in release builds too.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
