# Experimental and unaudited. See README.md.
[workspace]
members = ["programs/*", "crates/*"]
exclude = ["programs/README.md", "crates/README.md"]
resolver = "2"

# Lints every crate opts into with `[lints] workspace = true`.
[workspace.lints.rust]
# deny, not forbid: an Anchor program entry point may need a narrow, reviewed
# allow. Crates with no such need also forbid it in their own source.
unsafe_code = "deny"

[workspace.lints.clippy]
# Plain + - * / % and friends can overflow, wrap or panic. Math must use
# checked_* (or saturating_* where that is the intended behavior) instead.
arithmetic_side_effects = "deny"

[profile.release]
# Integer overflow aborts instead of silently wrapping, in release builds too.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
