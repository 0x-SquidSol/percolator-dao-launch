name: leak guards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard self-tests
        run: python3 -m unittest discover -s scripts/guards -p "test_*.py" -v

      - name: Scan branch or tag name
        env:
          GUARD_PATTERNS: ${{ secrets.GUARD_PATTERNS }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/guards/guard.py ref "${HEAD_REF:-$GITHUB_REF_NAME}"

      - name: Scan tracked files
        env:
          GUARD_PATTERNS: ${{ secrets.GUARD_PATTERNS }}
        run: python3 scripts/guards/guard.py tree

      - name: Claim-list spec (reference tests, vectors up to date)
        run: |
          python3 -m unittest discover -s scripts/spec -p "test_*.py" -v
          python3 scripts/spec/merkle_reference.py check

      - name: Provenance guard (no BSL-licensed MetaDAO material)
        run: python3 scripts/guards/provenance.py tree

      # Defence in depth only. A tag can point at a blob or tree, which the
      # commit scans below never see. The real protection is the pre-push
      # hook (GitHub most likely runs no workflow at all for a tag of a blob
      # or tree); this checks any tag that does reach CI leads to a commit.
      - name: Pushed tag points at a commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GUARD_PATTERNS: ${{ secrets.GUARD_PATTERNS }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          # Shows whether checkout kept the tag object (an annotated tag) or
          # only a ref to its commit; the tag's own text is checked only in
          # the first case.
          echo "pushed tag is a $(git cat-file -t "$PUSHED_REF")"
          python3 scripts/guards/guard.py commits "$PUSHED_REF"
          python3 scripts/guards/provenance.py commits "$PUSHED_REF"

      - name: Scan every pushed commit (identities, messages, files, provenance)
        env:
          GUARD_PATTERNS: ${{ secrets.GUARD_PATTERNS }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            python3 scripts/guards/guard.py commits "$BEFORE..$GITHUB_SHA"
            python3 scripts/guards/provenance.py commits "$BEFORE..$GITHUB_SHA"
          else
            python3 scripts/guards/guard.py commits HEAD
            python3 scripts/guards/provenance.py commits HEAD
          fi
