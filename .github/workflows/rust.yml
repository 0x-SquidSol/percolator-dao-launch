name: rust checks

# Experimental and unaudited. See README.md.
# Formatting, lints, build, tests and dependency checks for the Rust
# workspace. Rust 1.78 comes from rust-toolchain.toml via the runner's own
# rustup: no third-party toolchain actions and no build caches.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show toolchain (installs the pinned version)
        run: rustup show active-toolchain && cargo --version

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # cargo-deny needs a newer Rust than the workspace, so it is built with
      # the runner's stable toolchain, at an exact version, from its lockfile.
      - name: Install cargo-deny
        run: cargo +stable install --locked cargo-deny@0.20.2

      - name: Dependency checks (advisories, licenses, bans, sources)
        run: cargo +stable deny --locked check
