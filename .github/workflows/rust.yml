name: rust checks

# Experimental and unaudited. See README.md.
# Formatting, lints, build, tests and dependency checks for the Rust
# workspace. Rust 1.78 comes from rust-toolchain.toml via the runner's own
# rustup: no third-party toolchain actions and no build caches.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain (installs the pinned version)
        run: rustup show active-toolchain && cargo --version

      - name: Every crate uses the workspace lints
        run: |
          missing=0
          for manifest in programs/*/Cargo.toml crates/*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            if ! awk '{ sub(/\r$/, "") }
                /^\[lints\][ \t]*$/ { in_lints = 1; next }
                /^\[/ { in_lints = 0 }
                in_lints && /^workspace[ \t]*=[ \t]*true[ \t]*$/ { found = 1 }
                END { exit !found }' "$manifest"; then
              echo "::error file=$manifest::missing '[lints] workspace = true'"
              missing=1
            fi
          done
          exit "$missing"

      # cargo-mutants ignores cfg, so Kani-only code (never compiled by the
      # tests) is skipped by a marker on the next line. Fail if a Kani item
      # lacks it, if it appears anywhere else, if Kani code uses another cfg
      # form, or if a mutants config file or crate could hide real code.
      - name: Only Kani-only code is skipped by mutation testing
        run: |
          set -o pipefail
          bad=0
          git ls-files -z -- '*.rs' | xargs -0 -r awk '
            { sub(/\r$/, ""); line = $0; sub(/^[ \t]+/, "", line) }
            FNR == 1 { prev = "" }
            line == "#[cfg_attr(test, mutants::skip)]" && prev != "#[cfg(kani)]" {
              print FILENAME ":" FNR ": skip marker not right after #[cfg(kani)]"; bad = 1
            }
            prev == "#[cfg(kani)]" && line != "#[cfg_attr(test, mutants::skip)]" {
              print FILENAME ":" FNR - 1 ": #[cfg(kani)] without the skip marker after it"; bad = 1
            }
            line !~ /^\/\// && line ~ /kani/ && line ~ /cfg/ && line != "#[cfg(kani)]" && line != "#[cfg(not(kani))]" {
              print FILENAME ":" FNR ": unsupported kani cfg form: " line; bad = 1
            }
            # Any other code mentioning mutants, so a spaced or split
            # "mutants :: skip" cannot slip through.
            line !~ /^\/\// && line ~ /(^|[^A-Za-z0-9_])mutants([^A-Za-z0-9_]|$)/ && line != "#[cfg_attr(test, mutants::skip)]" {
              print FILENAME ":" FNR ": unexpected use of mutants: " line; bad = 1
            }
            { prev = line }
            END { exit bad }' || bad=1
          if [ -e .cargo/mutants.toml ]; then echo "no .cargo/mutants.toml allowed"; bad=1; fi
          if grep -q '^name = "mutants"$' Cargo.lock; then echo "no mutants crate allowed"; bad=1; fi
          exit "$bad"

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny needs a newer Rust than the workspace, so it is built with
      # the runner's stable toolchain, at an exact version, from its lockfile.
      - name: Install cargo-deny
        run: cargo +stable install --locked cargo-deny@0.20.2

      - name: Dependency checks (advisories, licenses, bans, sources)
        run: cargo +stable deny --locked check
