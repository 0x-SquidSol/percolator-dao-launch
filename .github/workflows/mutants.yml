name: mutation testing

# Experimental and unaudited. See README.md.
# Plants small deliberate bugs ("mutants") in the code and checks that the
# tests catch each one. Slow, so it runs only on demand, at internal audit
# points. Surviving mutants are listed in the uploaded report.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built with the runner's stable Rust at an exact version, from its
      # lockfile. The tests themselves run on the pinned Rust 1.78.
      - name: Install cargo-mutants
        run: cargo +stable install --locked cargo-mutants@27.1.0

      - name: Show toolchain (installs the pinned version)
        run: rustup show active-toolchain && cargo --version

      # Kani-only code is skipped by markers in the source (checked in the
      # rust workflow). --no-config ignores any mutants config file, so only
      # those markers and test code (which cargo-mutants always skips) are
      # left out.
      - name: Run mutation tests
        run: cargo mutants --workspace --no-shuffle --no-config --cargo-arg=--locked

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report
          path: mutants.out
          retention-days: 14
