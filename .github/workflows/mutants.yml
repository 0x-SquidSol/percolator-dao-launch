name: mutation testing

# Experimental and unaudited. See README.md.
# Plants small deliberate bugs ("mutants") in the code and checks that the
# tests catch each one. Slow, so it runs only on demand, at internal audit
# points. Surviving mutants are listed in the uploaded report.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Built with the runner's stable Rust at an exact version, from its
      # lockfile. The tests themselves run on the pinned Rust 1.78.
      - name: Install cargo-mutants
        run: cargo +stable install --locked cargo-mutants@27.1.0

      - name: Run mutation tests
        run: cargo mutants --workspace --no-shuffle --cargo-arg=--locked

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-report
          path: mutants.out
          retention-days: 14
