name: kani proofs

# Experimental and unaudited. See README.md.
# Kani proves properties for every possible input, not just examples. Kani
# brings its own Rust toolchain, separate from the Rust 1.78 build. Proofs
# here must stay fast (seconds): the solver is memory-hungry, and slow proofs
# belong in local runs, not CI.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  KANI_VERSION: 0.67.0

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built from its lockfile with the runner's stable Rust; `kani setup`
      # then downloads the matching Kani toolchain bundle.
      - name: Install Kani
        run: |
          cargo +stable install --locked kani-verifier@"$KANI_VERSION"
          cargo +stable kani setup

      # Kani passes a kani::cover! it can never meet, so a proof whose
      # assumptions rule out every input would still pass. Fail unless every
      # harness in the source ran, has covers and met them all, and Kani
      # finished with no failures (a changed log format fails too).
      - name: Run every proof
        run: |
          set -o pipefail
          cargo kani -p dao_common 2>&1 | tee "$RUNNER_TEMP/kani.log"
          want=$(grep -rhoE '#\[kani::proof\]' crates/dao_common/src | wc -l)
          awk -v want="$want" '
            /cover properties satisfied/ {
              n++
              if ($2 != $4 || $2 == 0) { bad = 1; print "unmet cover: " $0 }
            }
            /^Complete - / { done = ($3 == want && $7 == "0") }
            END {
              if (n != want) print "harnesses with cover results: " n ", expected " want
              if (!done) print "no clean finish for " want " harnesses"
              exit bad || n != want || !done
            }' "$RUNNER_TEMP/kani.log"
