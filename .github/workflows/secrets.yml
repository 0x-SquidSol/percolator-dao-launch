name: secret scan

# Experimental and unaudited. See README.md.
# Scans the full history for API keys, tokens and private keys, including
# Solana secret keys (custom rule in .gitleaks.toml). Findings are redacted.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release checksums.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # gitleaks reads every file version's stored bytes, never git's diff
      # output, which repository settings can change (scripts/guards/secretscan.py).
      - name: Scan full history
        run: PATH="$RUNNER_TEMP:$PATH" python3 scripts/guards/secretscan.py commits --all

      # The scan's own tests need the real gitleaks, so they run here.
      - name: Secret scan self-tests
        run: REQUIRE_GITLEAKS=1 PATH="$RUNNER_TEMP:$PATH" python3 -m unittest discover -s scripts/guards -p "test_secret_scan_attributes.py" -v
