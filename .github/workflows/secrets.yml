name: secret scan

# Experimental and unaudited. See README.md.
# Scans the full history for API keys, tokens and private keys, including
# Solana secret keys (custom rule in .gitleaks.toml). Findings are redacted.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release checksums.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # gitleaks reads every file version's stored bytes, never git's diff
      # output, which repository settings can change (scripts/guards/secretscan.py).
      # The scan settings (.gitleaks.toml) come from reviewed main plus every
      # version this event's own commit brings (other branches don't count):
      # a PR's base if that is main; main before a push to main; the current
      # main otherwise. If none can be found the scan refuses.
      - name: Scan full history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            rev="$BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            rev="$BEFORE_SHA"
          else
            rev="refs/remotes/origin/$DEFAULT_BRANCH"
          fi
          trusted=""
          if [ -n "$rev" ] && git rev-parse -q --verify "$rev^{commit}" >/dev/null; then
            trusted="--trusted $(git rev-parse "$rev^{commit}")"
          fi
          PATH="$RUNNER_TEMP:$PATH" python3 -I scripts/guards/secretscan.py commits $trusted --change HEAD --all

      # The scan's own tests need the real gitleaks, so they run here.
      - name: Secret scan self-tests
        run: REQUIRE_GITLEAKS=1 PATH="$RUNNER_TEMP:$PATH" python3 -m unittest discover -s scripts/guards -p "test_secret_scan_attributes.py" -v
