[package]
name = "dao_common"
version = "0.1.0"
description = "Shared helpers for the experiment's on-chain programs (experimental, unaudited)"
edition = "2021"
rust-version = "1.78"
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

# Left out of Kani builds: solana-program 1.17 pins dependencies that Kani's
# newer compiler rejects, and proofs use a stand-in hash instead. Logic that
# Kani checks must therefore stay plain Rust.
[target.'cfg(not(kani))'.dependencies]
# Latest 1.17 patch; Anchor 0.29 needs 1.17 (MetaDAO's lockfile has 1.17.14).
solana-program = "=1.17.34"

[dev-dependencies]
# Reads the shared claim-list vectors in tests; same version solana-program uses.
serde_json = "=1.0.154"
